name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      GOWORK: 'off'
      REDIS_TEST_ADDR: localhost:6379
    strategy:
      matrix:
        module: ['.', 'redis']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.1'
          cache-dependency-path: '**/go.sum'
      - name: Format check
        working-directory: ${{ matrix.module }}
        run: test -z "$(gofmt -l .)"
      - name: go.mod and go.sum are tidy
        working-directory: ${{ matrix.module }}
        run: go mod tidy -diff
      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...
      - name: Tests
        working-directory: ${{ matrix.module }}
        run: go test -race -count=1 ./...
